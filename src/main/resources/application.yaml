# ============================================================
# AList-Media-Sync 应用配置
# ============================================================
# 本文件定义应用的默认配置。
# 所有配置项均可通过环境变量覆盖（Spring Boot Relaxed Binding）。
# 详见 README.md 中的"环境变量说明"章节。
# ============================================================

server:
  port: ${SERVER_PORT:8080}            # HTTP 服务端口（环境变量 SERVER_PORT）
  shutdown: graceful                   # 优雅关闭：收到 SIGTERM 后等待进行中的请求完成

spring:
  application:
    name: AList-Media-Sync
  lifecycle:
    timeout-per-shutdown-phase: 12s    # 优雅关闭超时（略小于 Docker Compose stop_grace_period: 35s）
  datasource:
    url: jdbc:h2:file:${app.data-dir}/alist_media_sync;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:                          # H2 默认空密码
  h2:
    console:
      enabled: true                    # H2 控制台（开发调试用）
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update                 # 自动更新表结构（生产环境建议 validate）
    show-sql: false
    open-in-view: false                # 禁用 OSIV 避免懒加载问题
  threads:
    virtual:
      enabled: true                    # 启用 Java 21 虚拟线程
  # Spring AI MCP Server 配置（FR-012：默认禁用，由 app.mcp.enabled 派生保持一致）
  ai:
    mcp:
      server:
        # 与 app.mcp.enabled 联动：二者同源于 MCP_ENABLED 环境变量或 yaml 的 app.mcp.enabled。
        # 默认 false 关闭 MCP 服务器，显式开启后才提供服务（research.md R4）
        enabled: ${app.mcp.enabled:false}
        # 传输协议：Streamable HTTP（MCP 2025-03-26 规范）。
        # MUST 显式声明为 STREAMABLE——Spring AI @ConditionalOnProperty 读取的是环境属性而非 Java 默认值，
        # 若此处缺失，环境无该 key 时 matchIfMissing=true 触发弃用的 SSE 分支，Streamable 端点 /mcp 不会注册。
        protocol: STREAMABLE
        streamable-http:
          # MCP 端点路径（research.md R6，与主应用同端口嵌入）
          mcp-endpoint: /mcp

# Actuator 健康检查端点配置
management:
  endpoints:
    web:
      exposure:
        include: health                # 仅暴露 health 端点
  endpoint:
    health:
      show-details: always             # 始终显示健康检查详情

# 日志级别配置
# 开发环境：将 LOGGING_LEVEL 设为 DEBUG 或保持默认 INFO
# 生产环境：必须将 LOGGING_LEVEL 设为 WARN（通过环境变量或启动参数注入）
#   业务包 top.lldwb.alistmediasync 单独设为 INFO，确保关键业务日志可见
logging:
  level:
    root: ${LOGGING_LEVEL:INFO}
    top.lldwb.alistmediasync: ${LOGGING_LEVEL:INFO}
    # 静态资源 404 不输出错误堆栈，避免 NoResourceFoundException 日志污染
    # 浏览器缓存旧版构建产物、Chrome DevTools 探测请求均会触发此异常
    # 将 Spring MVC 资源映射层的日志级别设为 WARN，跳过 404 堆栈输出
    org.springframework.web.servlet.resource: WARN
  # 日志输出目录与文件由 logback-spring.xml 接管，仅在此处暴露目录变量供外部覆盖
  # LOG_PATH 环境变量可重定向日志输出目录（默认 ./logs）
  file:
    path: ${LOG_PATH:./logs}
  # 控制台与文件 pattern：增加 traceId、module、operation、errorType 结构化字段
  # 若 MDC 中缺失对应键，则输出空字符串，避免日志噪音
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [traceId=%X{traceId:-}] [module=%X{module:-}] [operation=%X{operation:-}] [errorType=%X{errorType:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [traceId=%X{traceId:-}] [module=%X{module:-}] [operation=%X{operation:-}] [errorType=%X{errorType:-}] %logger{36} - %msg%n"

# ============================================================
# SpringDoc OpenAPI 配置
# ============================================================
# 通过代码注解（@Tag/@Operation/@Schema）自动生成 API 文档。
# 运行时端点：/v3/api-docs（JSON）、/v3/api-docs.yaml（YAML）、/swagger-ui.html（UI）。
# 静态导出：./mvnw verify -Pgen-api-doc 生成 target/openapi.{json,yaml}，
#           再由 scripts/gen-api-doc 转换为 docs/05-API接口文档.md（派生产物）。
# 生产环境建议禁用 api-docs 与 swagger-ui，避免未认证访问暴露 API 结构。
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
  packages-to-scan: top.lldwb.alistmediasync
  show-actuator: false

# AList 连接配置（必填，由环境变量注入）
alist:
  base-url: ${ALIST_BASE_URL:}         # AList 服务器地址（如 https://alist.example.com）
  token: ${ALIST_TOKEN:}               # AList API 认证令牌
  # AES-256 加密密钥 — 由 CryptoKeyEnvironmentPostProcessor 从环境变量 ALIST_CRYPTO_KEY 读取
  # 生成方法：openssl rand -base64 32
  # ⚠️ 生产环境必须设置，否则每次重启生成随机密钥导致已加密数据无法解密

# ============================================================
# 自定义应用配置（app.* 命名空间）
# ============================================================
app:
  # 数据库文件存储目录（环境变量 DATA_DIR，默认 ./data）
  # 启动包场景使用相对路径 ./data（相对于启动包根目录）
  # Docker 场景使用 /app/data
  data-dir: ${DATA_DIR:./data}

  # 应用名称和版本（启动横幅输出使用）
  name: AList-Media-Sync
  version: 0.1.0

  # 历史记录保留天数（超过此天数的 TaskExecution 和 WebhookEvent 将被清理）
  retention-days: 30

  # ----------------------------------------
  # 管理后台认证配置
  # ----------------------------------------
  auth:
    # 管理员用户名（必填）
    username: admin
    # 登录密码（必填）
    # 仅支持明文密码。所有配置值均视为明文（包括含 {bcrypt} 前缀的旧格式），
    # 每次启动时自动使用随机盐值进行 BCrypt 加密，加密结果仅保存在内存中。
    # 加密值绝不写回此文件，配置文件始终保持用户填入的原始值。
    # {bcrypt} 预加密格式已废弃，不再被识别。
    # 环境变量覆盖：APP_AUTH_PASSWORD
    # 若密码为空或未设置，管理后台将无法登录，但服务仍正常启动
    password: ${APP_AUTH_PASSWORD:admin123}

  # ----------------------------------------
  # 转码配置
  # ----------------------------------------
  transcode:
    # 临时文件后缀（默认 .tmp）
    # 若不以点号开头，系统自动补充；合法字符：字母、数字、点号、下划线、连字符
    # 可通过环境变量 TRANSCODE_TEMP_SUFFIX 覆盖
    temp-suffix: ${TRANSCODE_TEMP_SUFFIX:.tmp}

    # 临时文件存储目录
    # Docker 场景下建议挂载独立卷，将 temp-dir 指向卷挂载路径
    # 可通过环境变量 TRANSCODE_TEMP_DIR 覆盖
    temp-dir: ${TRANSCODE_TEMP_DIR:${java.io.tmpdir}/alist-media-sync/transcode}

    # 最大并发转码任务数（默认 32）
    # Docker 容器内 Runtime.availableProcessors() 可能返回宿主机核心数，
    # 因此使用静态默认值作为保守上限，可通过环境变量覆盖
    # 可通过环境变量 TRANSCODE_MAX_CONCURRENT 覆盖
    max-concurrent-transcode: ${TRANSCODE_MAX_CONCURRENT:32}

    # 临时文件后缀最大长度（超过截断并警告）
    max-suffix-length: 50

  # ----------------------------------------
  # 线程池配置
  # ----------------------------------------
  pool:
    # 转码线程池核心线程数
    core-size: 8
    # 转码线程池最大线程数（与 max-concurrent-transcode 联动）
    max-size: 32

  # ----------------------------------------
  # WebSocket 配置
  # ----------------------------------------
  websocket:
    # WebSocket 最大并发连接数（默认 50）
    # 超过上限时拒绝新连接并返回 HTTP 429
    # 可通过环境变量 APP_WEBSOCKET_MAX_CONNECTIONS 覆盖
    max-connections: ${APP_WEBSOCKET_MAX_CONNECTIONS:50}

  # ----------------------------------------
  # 自动重试配置
  # ----------------------------------------
  retry:
    # 最大自动重试次数（默认 3，设为 0 禁用自动重试）
    # 可通过环境变量 APP_RETRY_MAX_AUTO_RETRIES 覆盖
    max-auto-retries: ${APP_RETRY_MAX_AUTO_RETRIES:3}
    # 初始重试间隔（毫秒，默认 1000 = 1 秒）
    initial-interval: 1000
    # 最大重试间隔（毫秒，默认 60000 = 60 秒）
    max-interval: 60000

  # ----------------------------------------
  # 存储引擎配置
  # ----------------------------------------
  storage:
    # 存储引擎健康检查间隔（秒，默认 300 = 5 分钟）
    health-check-interval: 300

  # ----------------------------------------
  # MCP 服务器配置（FR-012：默认禁用）
  # ----------------------------------------
  mcp:
    # MCP 服务器总开关（默认 false，禁用）。仅当 enabled=true 且 token 非空时才提供服务
    # 通过环境变量 MCP_ENABLED 覆盖（Relaxed Binding：${MCP_ENABLED:false}）
    # 注意：MUST 使用占位符而非字面值，否则环境变量无法覆盖、@ConditionalOnProperty 永远读取 yaml 默认值
    enabled: ${MCP_ENABLED:false}
    # MCP 专用访问令牌（Bearer Token），与 Web 管理 Basic Auth 凭据隔离（FR-008）
    # 空值时强制不可用；属敏感凭据，日志与诊断包 MUST NOT 打印其值
    # 可通过环境变量 MCP_TOKEN 覆盖
    token: ${MCP_TOKEN:}
